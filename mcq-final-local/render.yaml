services:
  - type: web
    name: mcq-examination-api
    runtime: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: alembic upgrade head && python backend/seed_dsa_exam.py && uvicorn --app-dir backend app.main:app --host 0.0.0.0 --port $PORT --proxy-headers
    rootDir: .
    envVars:
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: mcq-examination-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      - key: FRONTEND_URL
        value: https://engrszi.github.io


  # Keep this as a placeholder only. Choose an available PostgreSQL plan in Render.
databases:
  - name: mcq-examination-db
    plan: free
